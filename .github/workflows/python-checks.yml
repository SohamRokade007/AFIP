name: Python checks

on:
  push:
    branches:
      - feature/ignav-api
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pandas statsmodels

      - name: Compile application and live pipeline
        run: |
          python -m py_compile src/app.py src/live_fare_index.py src/build_live_index.py src/live_forecaster.py src/forecaster.py src/run_ignav_collection.py

      - name: Run offline collector tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
