name: Refresh airfare observations

on:
  workflow_dispatch:
  schedule:
    # 00:07 India Standard Time (UTC+05:30). Scheduled workflows run on the
    # repository's default branch; merge deployment into main to activate it.
    - cron: "37 18 * * *"

permissions:
  contents: write

concurrency:
  group: airfare-observation-refresh
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Kolkata
      IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
      IGNAV_MARKET: IN
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Compile collector and run offline tests
        run: |
          python -m py_compile src/run_ignav_collection.py
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify API secret is configured
        env:
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
        run: |
          if [ -z "$IGNAV_API_KEY" ]; then
            echo "::error::IGNAV_API_KEY is missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Record scrape start time
        run: echo "SCRAPE_STARTED_AT=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"

      - name: Collect verified airfare observations
        id: scrape
        env:
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
          IGNAV_MARKET: IN
        run: python src/run_ignav_collection.py --market IN

      - name: Validate newly collected fares
        id: validate
        run: |
          python - <<'PY'
          import csv
          import os
          import sys
          from datetime import datetime

          path = "data/processed/live_scraped_quotes_real.csv"
          if not os.path.exists(path):
              print("Collector did not create its expected CSV file.")
              sys.exit(1)

          started_at = datetime.strptime(
              os.environ["SCRAPE_STARTED_AT"], "%Y-%m-%d %H:%M:%S"
          )
          run_rows = []
          successful = []

          with open(path, newline="", encoding="utf-8-sig") as handle:
              for row in csv.DictReader(handle):
                  if row.get("source_platform") != "ignav":
                      continue
                  try:
                      collected_at = datetime.strptime(
                          row.get("scrape_timestamp", ""), "%Y-%m-%d %H:%M:%S"
                      )
                  except ValueError:
                      continue
                  if collected_at < started_at:
                      continue

                  run_rows.append(row)
                  try:
                      amount = float(row.get("parsed_fare_inr", ""))
                  except (TypeError, ValueError):
                      amount = 0
                  if row.get("status") == "ok" and amount > 0:
                      successful.append(row)

          if not run_rows:
              print("No Ignav rows were written by this collection run.")
              sys.exit(1)

          print("Ignav rows written by this run:", len(run_rows))
          print("Status breakdown:")
          for status in sorted({row.get("status", "") for row in run_rows}):
              print(f"  {status}: {sum(row.get('status') == status for row in run_rows)}")
          print("New verified INR fares:", len(successful))

          if not successful:
              print(
                  "ERROR: No new verified INR fares were collected. "
                  "Published observations will remain unchanged."
              )
              sys.exit(1)
          PY

      - name: Commit updated observations and diagnostics
        if: steps.validate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/live_scraped_quotes_real.csv
          if git diff --cached --quiet; then
            echo "No observation changes to commit."
          else
            git commit -m "Update verified airfare observations [skip ci]"
            git push
          fi

      - name: Upload API collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ignav-api-collection-${{ github.run_id }}
          path: api_debug/
          if-no-files-found: warn
          retention-days: 7
