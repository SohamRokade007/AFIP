name: Refresh airfare observations

on:
  workflow_dispatch:
  schedule:
    # 00:07 India Standard Time (UTC+05:30). Scheduled workflows run on the
    # repository's default branch; merge deployment into main to activate it.
    - cron: "37 18 * * *"

permissions:
  contents: write

concurrency:
  group: airfare-observation-refresh
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Kolkata
      IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
      IGNAV_MARKET: IN
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pipeline.txt

      - name: Verify API secret is configured
        run: |
          if [ -z "$IGNAV_API_KEY" ]; then
            echo "::error::IGNAV_API_KEY is missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Record scrape start time
        run: echo "SCRAPE_STARTED_AT=$(date '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"

      - name: Collect verified airfare observations
        id: scrape
        run: python src/run_ignav_collection.py --market IN

      - name: Validate newly collected fares
        id: validate
        run: |
          python - <<'PY'
          import os
          import sys
          import pandas as pd

          path = "data/processed/live_scraped_quotes_real.csv"
          if not os.path.exists(path):
              print("Scraper did not create its expected CSV file.")
              sys.exit(1)

          df = pd.read_csv(path)
          df["scrape_timestamp"] = pd.to_datetime(df["scrape_timestamp"], errors="coerce")
          started_at = pd.to_datetime(os.environ["SCRAPE_STARTED_AT"])
          run_rows = df[df["scrape_timestamp"] >= started_at].copy()

          if run_rows.empty:
              print("No rows were written by this collection run.")
              sys.exit(1)

          print("Rows written by this run:", len(run_rows))
          print("Status breakdown:")
          print(run_rows["status"].value_counts(dropna=False).to_string())

          run_rows["parsed_fare_inr"] = pd.to_numeric(
              run_rows["parsed_fare_inr"], errors="coerce"
          )
          successful = run_rows[
              run_rows["status"].eq("ok")
              & run_rows["parsed_fare_inr"].notna()
              & (run_rows["parsed_fare_inr"] > 0)
          ]

          print("New successful fare observations:", len(successful))
          if successful.empty:
              print(
                  "ERROR: No new verified INR fares were collected. "
                  "Inspect the uploaded Ignav collection summary artifact."
              )
              sys.exit(1)
          PY

      - name: Commit updated observations and diagnostics
        if: steps.validate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/live_scraped_quotes_real.csv
          if git diff --cached --quiet; then
            echo "No observation changes to commit."
          else
            git commit -m "Update scraped airfare observations [skip ci]"
            git push
          fi

      - name: Upload API collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ignav-api-collection-${{ github.run_id }}
          path: api_debug/
          if-no-files-found: warn
          retention-days: 7
